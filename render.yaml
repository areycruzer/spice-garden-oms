# Render Blueprint — API + Postgres
# Frontend is deployed separately on Vercel (SPA).
services:
  - type: web
    name: spice-garden-api
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start:api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3000"
      - key: DATABASE_URL
        fromDatabase:
          name: spice-garden-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: spice-garden-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
